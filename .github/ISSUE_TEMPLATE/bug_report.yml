name: Bug report
description: Report incorrect behavior, a browser problem, or a scoring discrepancy.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value:
        Thanks for helping improve D-Score Gymnastics. Do not include private routine data unless
        needed.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scoring behavior
        - Routine editor
        - Saving, backup, or restore
        - Web installation or offline use
        - Browser or device layout
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser or device
      placeholder: iPhone / iOS / Safari, or Windows / Chrome
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the apparatus and selected elements for scoring problems.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official rules source
      description: Required for scoring corrections; include the publication and page when possible.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label:
            I removed private or identifying routine data that is not needed to reproduce this
            issue.
          required: true
