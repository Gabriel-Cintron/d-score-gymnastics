name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI push on main containing the verified web-release artifact
        required: true

concurrency:
  group: pages-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Select trusted successful CI commit
        id: candidate
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ inputs.ci_run_id }}
        with:
          script: |
            if (!/^\d+$/.test(process.env.RUN_ID)) throw new Error('Invalid CI run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(process.env.RUN_ID)});
            if (run.conclusion !== 'success' || run.event !== 'push' || run.head_branch !== 'main' ||
                run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}` || run.path !== '.github/workflows/ci.yml') {
              throw new Error('Select successful main-branch CI from this repository');
            }
            core.setOutput('sha', run.head_sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm publication:check -- web
      - uses: actions/download-artifact@v4
        with:
          name: web-release
          path: build/web-release
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - run: node scripts/verify-web-artifact.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web-release/site

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy manually selected fallback
        id: deployment
        uses: actions/deploy-pages@v4
